<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script defer src="javascript.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        display: flex;
        justify-content: center;
      }
      #container {
        width: 650px;
        height: 650px;
        border: 1px solid;
        display: flex;
        flex-wrap: wrap;
      }
      .grid-items {
        flex: 0 0 calc(100% / var(--columns, 1));
        aspect-ratio: 1 / 1;
        border: 2px solid green;
        /* transition: 1s cubic-bezier(0,1.84,0,-0.47); */
      }
      /* .grid-items:hover {
        background: red;
      } */
    </style>
  </head>
  <body>
    <div id="container"></div>
  </body>
</html>
