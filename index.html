<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script defer src="javascript.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: #b0c4de;
        display: flex;
        align-items: center;
        flex-direction: column;
      }
      button {
        padding: 20px 0;
        background-color: #5cadff;
        width: 604px;
        border: none;
        cursor: pointer;
      }
      #container {
        width: 600px;
        height: 600px;
        outline: 2px solid;
        display: flex;
        flex-wrap: wrap;
        background-color: black;
      }
      .grid-items {
        background-color: #b0c4de;
        flex: 0 0 calc(100% / var(--columns, 1));
        aspect-ratio: 1 / 1;
      }
    </style>
  </head>
  <body>
    <button>grid size</button>
    <div id="container"></div>
  </body>
</html>
